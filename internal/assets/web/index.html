<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gdb-wui</title>
<link rel="stylesheet" href="/vendor/xterm-6.0.0/xterm.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/panels.css">
<link rel="icon" href="data:,">
</head>
<body>
<div id="app">
  <header class="toolbar" role="toolbar" aria-label="Debugger controls">
    <span class="brand">gdb-wui</span>
    <span class="exec-group">
      <button id="btn-run"      class="btn" title="Run to the first breakpoint (Ctrl+F5)">Run</button>
      <button id="btn-run-main" class="btn" title="Run and stop at main (Ctrl+Shift+F5)">Run→main</button>
      <button id="btn-run-entry" class="btn" title="Run and stop at the first instruction — the only way into a stripped binary">Run→entry</button>
      <button id="btn-continue" class="btn" title="Continue (F5)">▶</button>
      <button id="btn-pause"    class="btn" title="Pause (F6)">⏸</button>
      <button id="btn-next"     class="btn" title="Step over (F10)">⤼</button>
      <button id="btn-step"     class="btn" title="Step into (F11)">↳</button>
      <button id="btn-finish"   class="btn" title="Step out (Shift+F11)">↰</button>
      <button id="btn-stepi"    class="btn" title="Step one instruction (Alt+F11)">↓i</button>
      <button id="btn-nexti"    class="btn" title="Step over one instruction (Alt+F10)">⤼i</button>
      <button id="btn-kill"     class="btn btn-danger" title="Kill">■</button>
    </span>
    <span id="exe-name" class="toolbar-exe"></span>
    <span class="toolbar-gap"></span>
    <span id="stop-reason" class="toolbar-reason"></span>
    <span id="run-state" class="pill" data-state="noProgram">no program</span>
  </header>

  <aside class="panel panel-tree" aria-label="Project files">
    <div class="panel-head">
      <span class="panel-title">Files</span>
      <span id="project-root" class="panel-sub" title=""></span>
    </div>
    <div id="tree" class="panel-body tree" role="tree" tabindex="0"></div>
  </aside>

  <main class="panel panel-source" aria-label="Source">
    <div class="panel-head tabs" role="tablist">
      <button class="tab is-active" data-center="source" role="tab">Source</button>
      <button class="tab" data-center="disasm" role="tab">Disassembly</button>
      <span id="source-path" class="panel-title"></span>
      <span id="source-meta" class="panel-sub"></span>
    </div>
    <div id="source" class="panel-body source" data-center="source" tabindex="0"></div>
    <div id="disasm" class="panel-body asm is-hidden" data-center="disasm" tabindex="0"></div>
  </main>

  <aside class="panel panel-right" aria-label="Debug state">
    <div class="panel-head tabs" role="tablist">
      <button class="tab is-active" data-tab="variables" role="tab">Variables</button>
      <button class="tab" data-tab="registers" role="tab">Registers</button>
      <span class="toolbar-gap"></span>
      <button id="btn-add-watch" class="btn btn-small" title="Add a watch expression">+ watch</button>
    </div>
    <div id="variables" class="panel-body vars" data-panel="variables" role="tree"></div>
    <div id="registers" class="panel-body regs is-hidden" data-panel="registers" role="list"></div>

    <div class="panel-head panel-head-split">
      <span class="panel-title">Call stack</span>
    </div>
    <div id="stack" class="panel-body list" role="list"></div>
    <div class="panel-head panel-head-split">
      <span class="panel-title">Breakpoints</span>
    </div>
    <div id="breakpoints" class="panel-body list" role="list"></div>
    <div class="panel-head panel-head-split">
      <span class="panel-title">Threads</span>
    </div>
    <div id="threads" class="panel-body list" role="list"></div>
  </aside>

  <section class="panel panel-bottom" aria-label="Console">
    <div class="panel-head tabs" role="tablist">
      <button class="tab is-active" data-bottom="gdb" role="tab">gdb console</button>
      <button class="tab" data-bottom="inferior" role="tab">Program</button>
      <button class="tab" data-bottom="log" role="tab">Log</button>
      <span class="toolbar-gap"></span>
      <span id="log-hint" class="panel-sub"></span>
      <button id="btn-clear-log" class="btn btn-small" title="Clear">clear</button>
    </div>
    <div id="gdbconsole" class="panel-body term" data-bottom="gdb"></div>
    <div id="inferior" class="panel-body term is-hidden" data-bottom="inferior"></div>
    <div id="log" class="panel-body log is-hidden" data-bottom="log" tabindex="0"></div>
  </section>

  <footer class="statusbar">
    <span id="conn" class="status-item" data-state="connecting">connecting…</span>
    <span id="gdb-version" class="status-item status-dim"></span>
    <span class="toolbar-gap"></span>
    <span id="status-message" class="status-item"></span>
  </footer>
</div>

<script type="module" src="/js/main.js"></script>
</body>
</html>

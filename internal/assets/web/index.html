<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>gdb-wui</title>
<link rel="stylesheet" href="/vendor/xterm-6.0.0/xterm.css">
<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/panels.css">
<link rel="icon" href="data:,">
</head>
<body>
<div id="app">
  <header class="toolbar" role="toolbar" aria-label="Debugger controls">
    <span class="brand">gdb-wui</span>
    <span class="exec-group">
      <button id="btn-run"      class="btn" title="Run to the first breakpoint (Ctrl+F5)">Run</button>
      <button id="btn-run-main" class="btn" title="Run and stop at main (Ctrl+Shift+F5)">Run→main</button>
      <button id="btn-run-entry" class="btn" title="Run and stop at the first instruction — the only way into a stripped binary">Run→entry</button>
      <button id="btn-continue" class="btn" title="Continue (F5)">▶</button>
      <button id="btn-pause"    class="btn" title="Pause (F6)">⏸</button>
      <button id="btn-next"     class="btn" title="Step over (F10)">⤼</button>
      <button id="btn-step"     class="btn" title="Step into (F11)">↳</button>
      <button id="btn-finish"   class="btn" title="Step out (Shift+F11)">↰</button>
      <button id="btn-stepi"    class="btn" title="Step one instruction (Alt+F11)">↓i</button>
      <button id="btn-nexti"    class="btn" title="Step over one instruction (Alt+F10)">⤼i</button>
      <button id="btn-kill"     class="btn btn-danger" title="Kill">■</button>
    </span>
    <span id="exe-name" class="toolbar-exe"></span>
    <span class="toolbar-gap"></span>
    <span id="stop-reason" class="toolbar-reason"></span>
    <button id="btn-restart" class="btn btn-small is-hidden"
            title="gdb has died — start a fresh one and restore breakpoints">restart gdb</button>
    <button id="btn-theme" class="btn btn-small" title="Switch theme" aria-label="Switch theme">◑</button>
    <button id="btn-about" class="btn btn-small" title="About gdb-wui" aria-label="About gdb-wui">?</button>
    <span id="run-state" class="pill" data-state="noProgram" role="status" aria-live="polite">no program</span>
  </header>

  <aside class="panel panel-tree" aria-label="Project files">
    <div class="panel-head">
      <span class="panel-title">Files</span>
      <span id="project-root" class="panel-sub" title=""></span>
    </div>
    <div id="tree" class="panel-body tree" role="tree" tabindex="0"></div>

    <div class="panel-head panel-head-split">
      <span class="panel-title">Symbols</span>
      <span id="symbols-count" class="panel-sub"></span>
      <span class="toolbar-gap"></span>
      <button id="symbols-load-open" class="btn btn-small"
              title="Add a symbol table. Does NOT set the architecture — click the ELF in the file tree for that.">+ load</button>
    </div>
    <div class="symbols-filter">
      <input id="symbols-search" class="addr-input" type="search"
             placeholder="filter symbols" aria-label="Filter symbols"
             autocomplete="off" spellcheck="false">
      <select id="symbols-kind" class="kind-select" aria-label="Symbol kind">
        <option value="">all</option>
        <option value="function">fn</option>
        <option value="variable">var</option>
      </select>
    </div>
    <div id="symbols" class="panel-body list symbols" role="list" tabindex="0"></div>
  </aside>
  <div id="split-tree" class="splitter splitter-v" role="separator"
       aria-orientation="vertical" aria-label="Resize the file tree" tabindex="0"></div>

  <main class="panel panel-source" aria-label="Source">
    <div class="panel-head tabs" role="tablist">
      <button class="tab is-active" data-center="source" role="tab">Source</button>
      <button class="tab" data-center="disasm" role="tab">Disassembly</button>
      <button class="tab" data-center="decomp" role="tab" title="Recovered C from Ghidra. A model of the program, not its source.">Decompiled</button>
      <button class="tab" data-center="memory" role="tab">Memory</button>
      <!-- One box for all four views, acting on the focused one: the same
           place means a line to the source view and an address to the
           disassembly, and two boxes in this bar would only make you choose
           which to type into. -->
      <input id="goto" class="addr-input goto-input" type="text"
             placeholder="go to  walk · 0x401136"
             title="Go to a symbol, an address or a line, in the focused view (Ctrl+Shift+G)"
             aria-label="Go to a symbol, address or line"
             spellcheck="false" autocomplete="off">
      <span class="toolbar-gap"></span>
      <button id="btn-split" class="btn btn-small"
              title="Show two views side by side (F7)" aria-pressed="false">⫿</button>
      <button id="btn-split-orient" class="btn btn-small is-hidden"
              title="Stack the two views instead (Shift+F7)">⊟</button>
    </div>
    <div id="locate" class="locate-bar is-hidden" role="alert">
      <span id="locate-text"></span>
      <select id="locate-pick" class="locate-pick" aria-label="Choose the matching local file"></select>
      <button id="locate-apply" class="btn btn-small">use this file</button>
    </div>
    <div id="confirm" class="confirm-bar is-hidden" role="alertdialog"
         aria-labelledby="confirm-text">
      <span id="confirm-text"></span>
      <button id="confirm-yes" class="btn btn-small">yes</button>
      <button id="confirm-no" class="btn btn-small">cancel</button>
    </div>
    <div id="symbols-load" class="confirm-bar is-hidden" role="group"
         aria-label="Load symbols">
      <span class="confirm-label">Load symbols</span>
      <input id="symbols-load-path" class="addr-input symload-path" type="text"
             placeholder="path to an ELF, relative to the project"
             aria-label="Symbol file" spellcheck="false" autocomplete="off">
      <select id="symbols-load-mode" class="kind-select" aria-label="Load mode">
        <option value="replace">replace</option>
        <option value="add">add</option>
      </select>
      <input id="symbols-load-offset" class="addr-input symload-offset is-hidden"
             type="text" placeholder="offset e.g. 0x8000"
             aria-label="Address offset" spellcheck="false" autocomplete="off">
      <button id="symbols-load-go" class="btn btn-small">load</button>
      <button id="symbols-load-cancel" class="btn btn-small">cancel</button>
    </div>
    <!-- The centre views live in one grid with two slots. A view is placed by
         its data-slot rather than being reparented, because moving a node
         resets its scrollTop and you would lose your place in a file every
         time you moved it between slots. -->
    <div id="center" class="center" data-split="off">
      <div class="slot-head" data-slot-head="a">
        <span class="slot-name" data-slot-name="a"></span>
        <span id="source-path" class="panel-title"></span>
        <span id="source-meta" class="panel-sub"></span>
      </div>
      <div class="slot-head is-hidden" data-slot-head="b">
        <span class="slot-name" data-slot-name="b"></span>
        <span id="source-path-b" class="panel-title"></span>
        <span id="source-meta-b" class="panel-sub"></span>
      </div>
      <div id="split-center-x" class="splitter splitter-v is-hidden" role="separator"
           aria-orientation="vertical" aria-label="Resize the split" tabindex="0"></div>
      <div id="split-center-y" class="splitter splitter-h is-hidden" role="separator"
           aria-orientation="horizontal" aria-label="Resize the split" tabindex="0"></div>

      <div id="source" class="panel-body source" data-center="source" data-slot="a" tabindex="0"></div>
      <div id="disasm" class="panel-body asm" data-center="disasm" tabindex="0"></div>
      <div id="decomp" class="panel-body dec" data-center="decomp" tabindex="0"></div>
      <div id="memory" class="panel-body mem" data-center="memory" tabindex="0"></div>
    </div>
  </main>

  <div id="split-right" class="splitter splitter-v" role="separator"
       aria-orientation="vertical" aria-label="Resize the debug panel" tabindex="0"></div>

  <aside class="panel panel-right" aria-label="Debug state">
    <div class="panel-head tabs" role="tablist">
      <button class="tab is-active" data-tab="variables" role="tab">Variables</button>
      <button class="tab" data-tab="registers" role="tab">Registers</button>
      <span class="toolbar-gap"></span>
      <button id="btn-add-watch" class="btn btn-small" title="Add a watch expression">+ watch</button>
    </div>
    <div id="variables" class="panel-body vars" data-panel="variables" role="tree"></div>
    <div id="registers" class="panel-body regs is-hidden" data-panel="registers" role="list"></div>

    <div class="panel-head panel-head-split">
      <span class="panel-title">Call stack</span>
    </div>
    <div id="stack" class="panel-body list" role="list"></div>
    <div class="panel-head panel-head-split">
      <span class="panel-title">Breakpoints</span>
    </div>
    <div id="breakpoints" class="panel-body list" role="list"></div>
    <div class="panel-head panel-head-split">
      <span class="panel-title">Threads</span>
    </div>
    <div id="threads" class="panel-body list" role="list"></div>
  </aside>

  <div id="split-bottom" class="splitter splitter-h" role="separator"
       aria-orientation="horizontal" aria-label="Resize the console" tabindex="0"></div>

  <section class="panel panel-bottom" aria-label="Console">
    <div class="panel-head tabs" role="tablist">
      <button class="tab is-active" data-bottom="gdb" role="tab">gdb console</button>
      <button class="tab" data-bottom="inferior" role="tab">Program</button>
      <button class="tab" data-bottom="log" role="tab">Log</button>
      <span class="toolbar-gap"></span>
      <span id="log-hint" class="panel-sub"></span>
      <span class="remote-bar">
        <span id="remote-state" class="pill" data-remote="off" role="status"
              aria-live="polite">no target</span>
        <input id="remote-addr" class="addr-input remote-addr" type="text"
               value="localhost:1234" aria-label="Remote target address"
               spellcheck="false" autocomplete="off">
        <button id="remote-connect" class="btn btn-small"
                title="target remote — connect gdb to a gdbserver or emulator stub">connect</button>
        <button id="remote-disconnect" class="btn btn-small"
                title="disconnect — leave the target running">disconnect</button>
      </span>
      <button id="btn-clear-log" class="btn btn-small" title="Clear">clear</button>
    </div>
    <div id="gdbconsole" class="panel-body term" data-bottom="gdb"></div>
    <div id="inferior" class="panel-body term is-hidden" data-bottom="inferior"></div>
    <div id="log" class="panel-body log is-hidden" data-bottom="log" tabindex="0"></div>
  </section>

  <footer class="statusbar">
    <span id="conn" class="status-item" data-state="connecting">connecting…</span>
    <span id="gdb-version" class="status-item status-dim"></span>
    <span class="toolbar-gap"></span>
    <span id="status-message" class="status-item"></span>
  </footer>
</div>

<!-- The avatar is served from the binary rather than fetched from GitHub, so
     that opening this box works offline and tells nobody you opened it. -->
<div id="about" class="modal-backdrop is-hidden" role="dialog" aria-modal="true"
     aria-labelledby="about-title">
  <div class="about">
    <img class="about-avatar" src="/img/retrocpugeek.png" width="72" height="72"
         alt="retrocpugeek">
    <h2 id="about-title" class="about-name">gdb-wui</h2>
    <p class="about-tagline">A fast and friendly interface to GDB.</p>
    <dl class="about-facts">
      <dt>Version</dt><dd id="about-version">dev</dd>
      <dt>GDB</dt><dd id="about-gdb">—</dd>
    </dl>
    <p class="about-copy">
      Copyright © 2026 retrocpugeek. Licensed under the
      <a href="https://github.com/retrocpugeek/gdb-wui/blob/master/LICENSE"
         target="_blank" rel="noopener noreferrer">Apache License, Version 2.0</a>.
    </p>
    <p class="about-links">
      <a href="https://retrocpugeek.github.io/gdb-wui/"
         target="_blank" rel="noopener noreferrer">Documentation</a>
      <a href="https://github.com/retrocpugeek/gdb-wui"
         target="_blank" rel="noopener noreferrer">Source</a>
      <a href="https://github.com/retrocpugeek/gdb-wui/issues"
         target="_blank" rel="noopener noreferrer">Issues</a>
    </p>
    <button id="about-close" class="btn btn-small">close</button>
  </div>
</div>

<div id="ctxmenu" class="ctxmenu is-hidden" role="menu"></div>
<div id="hovertip" class="hovertip is-hidden" role="tooltip"></div>

<script type="module" src="/js/main.js"></script>
</body>
</html>

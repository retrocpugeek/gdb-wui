# GitHub Pages builds this. Nothing here has to be run to publish it, which is
# the point: the repository's promise is `go build` and done, and a
# documentation site that needed a bundler would quietly break it.
#
# Serve from master:/docs — Settings → Pages → Deploy from a branch.
#
# To preview a change before pushing it: `make docs`, which serves the site at
# 127.0.0.1:4000. That needs Jekyll installed locally; see the README.

title: gdb-wui
description: A web UI for GDB — source, disassembly, memory and a real gdb console in a browser tab.
url: https://retrocpugeek.github.io
baseurl: /gdb-wui

remote_theme: just-the-docs/just-the-docs
plugins:
  - jekyll-remote-theme
  # Rewrites `[Install](install.md)` to the built page's URL. Without it those
  # links render as href="install.md" and 404 on the site, while the sidebar —
  # which the theme generates from front matter — keeps working, so the site
  # looks fine until someone follows a link in the text.
  #
  # The alternative is writing .html in the source, which would then break when
  # the same file is read on GitHub. This way one link works in both places.
  # Both plugins are on GitHub Pages' allowlist, so nothing is built by hand.
  - jekyll-relative-links

# The developer documents live in this directory too, and are deliberately not
# part of the site: they describe the wire protocol and the decompiler's
# internals, which is not what someone arriving here is looking for. They stay
# readable on GitHub, and the site links to them where they are genuinely the
# next thing to read.
exclude:
  - protocol.md
  - decompilation.md
  - findings.md

# Dark, because the application is. A documentation page whose screenshots are
# all dark reads badly against a white background.
color_scheme: dark

search_enabled: true
search:
  heading_level: 2
  previews: 3

aux_links:
  GitHub: https://github.com/retrocpugeek/gdb-wui
aux_links_new_tab: true

heading_anchors: true

# Callouts have to be declared before `{: .warning }` in front of a blockquote
# means anything; undeclared, it is a CSS class with no rule behind it and the
# warning renders as an ordinary quote.
callouts_level: quiet
callouts:
  warning:
    title: Warning
    color: red
  note:
    title: Note
    color: blue

footer_content: >-
  gdb-wui — a fast and friendly interface to GDB.

# Ordered by what a reader needs first, not alphabetically.
nav_sort: case_insensitive
